spring.application.name=RedisLite
server.port=8080

# In-memory store limits. Change these values to experiment.
redislite.store.max-entries=100000
redislite.store.max-key-length=256
redislite.store.max-value-length=1048576
redislite.store.max-ttl-seconds=31536000

# Background cleanup frequency (milliseconds).
redislite.cleanup-interval-ms=30000
